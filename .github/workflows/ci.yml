name: CI

# Typecheck (src and tests), lint and the integration tests on every pull request, before anything
# reaches main (merging deploys to production).
#
# `pull_request`, never `pull_request_target`: the job runs the PR's code, so it gets read-only
# repository access and no secrets (threat model M6).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway database. Its password is not a secret: the container only lives for this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expenso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/setup.ts refuses to run unless the database name contains "expenso_test".
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expenso_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/expenso_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-used-in-any-deployment
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
