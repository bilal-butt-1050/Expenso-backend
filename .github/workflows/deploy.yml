name: Deploy Expenso Backend

on:
  push:
    branches:
      - main
      - master

# Every deploy targets the same server. Two merges in quick succession used to run concurrently and
# race to recreate the API container ("container name ... is already in use"). Queue them instead,
# and never cancel one that is mid-migration. If several queue up, GitHub keeps only the newest
# pending run, which is fine: each deploy resets the server to the latest origin/main anyway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Oracle VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/expenso-backend

            echo "==> Syncing with origin/${{ github.ref_name }}..."
            git diff || true
            git stash || true
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "==> Building backend service..."
            docker compose build api

            echo "==> Starting database..."
            docker compose up -d db

            echo "==> Waiting for database to accept connections..."
            for i in $(seq 1 30); do
              if docker compose exec -T db pg_isready -q; then break; fi
              sleep 2
            done
            docker compose exec -T db pg_isready

            # ---------------------------------------------------------------
            # Back up BEFORE touching the schema.
            #
            # Migrations are forward-only and some are irreversible, so this
            # dump is the rollback path. If it fails, the deploy stops here
            # rather than migrating an unprotected database.
            #
            # The dump runs *inside* the db container, over its local socket.
            # Two reasons not to hand pg_dump the connection URL:
            #   1. Prisma URLs carry non-libpq parameters — `?schema=public`
            #      makes pg_dump exit with "invalid URI query parameter",
            #      which is exactly what broke the previous deploy.
            #   2. A bare `docker run` container is not on the compose
            #      network, so it could resolve neither the `db` hostname nor
            #      a loopback-bound port on the host.
            # Inside the container both problems vanish: POSTGRES_USER and
            # POSTGRES_DB are already set, and the local socket needs no
            # credentials.
            # ---------------------------------------------------------------
            echo "==> Backing up database..."
            mkdir -p backups
            STAMP=$(date -u +%Y%m%d-%H%M%S)
            DUMP="backups/pre-migrate-$STAMP.sql"

            docker compose exec -T db sh -c \
              'pg_dump --no-owner --no-privileges -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$DUMP"

            if [ ! -s "$DUMP" ]; then
              echo "FATAL: backup is empty — refusing to migrate." >&2
              rm -f "$DUMP"
              exit 1
            fi

            # A dump that died midway can still be non-empty, so require the
            # terminator pg_dump writes only after a clean run.
            if ! tail -5 "$DUMP" | grep -q "PostgreSQL database dump complete"; then
              echo "FATAL: backup is truncated — refusing to migrate." >&2
              rm -f "$DUMP"
              exit 1
            fi
            echo "    backup ok: $DUMP ($(du -h "$DUMP" | cut -f1))"

            # Keep the 10 most recent.
            ls -1t backups/pre-migrate-*.sql 2>/dev/null | tail -n +11 | xargs -r rm -f

            # ---------------------------------------------------------------
            # Apply migrations.
            #
            # `migrate deploy` replaces `db push`. Push diffs the live schema
            # against schema.prisma and silently mutates to match, which left
            # the committed migration history bypassed and the database
            # carrying objects no migration ever created. For a finance app
            # the schema history has to be auditable and replayable.
            # ---------------------------------------------------------------
            echo "==> Applying migrations..."
            docker compose run --rm api npx prisma migrate deploy

            echo "==> Launching updated services..."
            docker compose up -d

            echo "==> Pruning dangling images..."
            docker image prune -f

            echo "==> Health check..."
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:4000/health > /dev/null; then
                echo "    healthy"
                exit 0
              fi
              sleep 2
            done

            echo "FATAL: service did not become healthy." >&2
            docker compose logs --tail=50 api >&2
            exit 1
