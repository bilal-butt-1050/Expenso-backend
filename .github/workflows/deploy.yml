name: Deploy Expenso Backend

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Oracle VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/expenso-backend

            echo "==> Inspecting server changes and syncing with origin/${{ github.ref_name }}..."
            git diff || true
            git stash || true
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "==> Ensuring database service is running..."
            docker compose up -d db

            echo "==> Building backend service..."
            docker compose build api

            echo "==> Synchronizing database schema safely..."
            # Run schema sync via one-off container against the live postgres service.
            # Prisma db push automatically detects and aborts on any data loss, protecting production data.
            docker compose run --rm api npx prisma db push --skip-generate

            echo "==> Launching updated services..."
            docker compose up -d

            echo "==> Pruning dangling images..."
            docker image prune -f